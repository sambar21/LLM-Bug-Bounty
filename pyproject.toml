[project]
name = "triage-injection-bench"
version = "0.1.0"
description = "Can a fake bug bounty report talk an LLM triager into approving it?"
requires-python = ">=3.11"
dependencies = [
    "openai==3.24.0",
    "matplotlib==3.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.17.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Report text is data, not code; the fakes contain deliberately sloppy snippets.
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
